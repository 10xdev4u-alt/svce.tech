version: 2

updates:
  # pnpm project (npm ecosystem understands pnpm-lock.yaml)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
    ignore:
      # eslint-config-next is coupled to the Next.js major (16.x needs next 16)
      - dependency-name: 'eslint-config-next'
        versions: ['>=16']
      # TypeScript 6 rejects CSS side-effect imports; upgrade deliberately
      - dependency-name: 'typescript'
        versions: ['>=6']

  # GitHub Actions workflows themselves
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
