name: Manage Push Subscriptions

on:
  repository_dispatch:
    types: [save_push_subscription, remove_push_subscription]

jobs:
  manage-subscription:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout subscriptions repo
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SUBSCRIPTION_REPO }}
          token: ${{ secrets.GH_DB_PAT }}
          path: subs-repo

      - name: Process event
        id: process
        run: |
          ID="${{ github.event.client_payload.subscription.subscriptionId }}"
          ACTION="${{ github.event.action }}"
          echo "subscription_id=${ID}" >> $GITHUB_OUTPUT
          echo "action=${ACTION}" >> $GITHUB_OUTPUT

      - name: Save subscription
        if: steps.process.outputs.action == 'save_push_subscription'
        run: |
          FILE="subs-repo/${{ steps.process.outputs.subscription_id }}.json"
          echo '${{ toJSON(github.event.client_payload.subscription) }}' > "$FILE"
          echo "Saved $FILE"

      - name: Remove subscription
        if: steps.process.outputs.action == 'remove_push_subscription'
        run: |
          FILE="subs-repo/${{ steps.process.outputs.subscription_id }}.json"
          if [ -f "$FILE" ]; then rm "$FILE" && echo "Removed $FILE"; else echo "Not found: $FILE"; fi

      - name: Commit and push
        run: |
          cd subs-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "${{ steps.process.outputs.action }} ${{ steps.process.outputs.subscription_id }}"
            git push
          fi
