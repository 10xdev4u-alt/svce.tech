# CodeRabbit AI code review configuration — svce.tech
# Reference: https://docs.coderabbit.ai/reference/configuration

language: 'en-US'
early_access: false

tone_instructions: "Keep reviews concise and friendly. Suggest fixes phrased in the project's tight 6-word conventional-commit style."

reviews:
  # Assertive: catches correctness + style issues, not just nits
  profile: 'assertive'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  abort_on_close: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - 'main'
    ignore_title_keywords:
      - 'skip review'
      - 'wip'
    # Pace incremental reviews so free-plan rate limits aren't hit on busy branches
    auto_pause_after_reviewed_commits: 3
  path_instructions:
    - path: 'src/components/**'
      instructions: |
        Follow the existing "Campus Aurora" design system and component patterns:
        - Reuse the semantic tokens (`bg-surface`, `bg-surface-2`, `text-ink/*`, `border-line/*`, `text-on-accent`) instead of hardcoded `bg-white`, `text-black`, `bg-[#fbfbf7]`.
        - Use `dark:` variants only for special cases (gradients, chips) that tokens can't express.
        - Anything `position: fixed` rendered inside the sticky header must be portaled to `document.body` (the header's backdrop-blur creates a containing block).
        - Keep the single-instance rule: never render `<PushSubscribe />` twice.
        - Preserve the a11y baseline: Escape-to-close, scroll lock, focus restore on modals/palette.
    - path: 'src/data/**'
      instructions: |
        Data must be real and verified — never AI-generated or fabricated. Fields must pass `scripts/validate-data.mjs` (dates YYYY-MM-DD, times HH:MM 24h, valid URLs, whitelisted categories, no duplicates).
  pre_merge_checks:
    title:
      mode: warning
      requirements: 'Use conventional commits format (type: description), concise, ideally under 60 characters.'
  tools:
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true

chat:
  auto_reply: true
